spring.application.name=citieye_server


# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/whitepage_db?stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.clean-on-validation-error=false
spring.flyway.schemas=public,auth,citizen_profile,cohort_placement,admins,notification

logging.level.org.springframework.security=DEBUG

# Trust proxy/gateway headers (e.g. X-Forwarded-*) from Nginx/Ngrok
server.forward-headers-strategy=FRAMEWORK

# ─── SSE / Long-Polling Support ───────────────────────────────────────────────
# Disable the Spring MVC async request timeout so Tomcat does NOT kill SseEmitter
# threads before the emitter's own timeout fires (default Tomcat async = ~30s
# which is far too short for persistent SSE connections).
# The SseEmitter itself manages its lifecycle (0L = indefinite, heartbeat keeps alive).
spring.mvc.async.request-timeout=-1

# Tomcat keep-alive: allow the HTTP/1.1 connection to stay open long enough for SSE.
# Default is 60s which can prematurely close idle SSE sockets between heartbeats.
server.tomcat.keep-alive-timeout=300000
