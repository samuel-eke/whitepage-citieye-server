# ============================================================================
# Docker Compose for CitiEye Server — Spring Boot + PostgreSQL
# ============================================================================
# Runs the optimized Spring Boot application alongside a PostgreSQL database.
# Credentials are sourced from the .env file (loaded automatically by Compose).

services:
  # ========================================================================
  # Spring Boot Web Application
  # ========================================================================
  web:
    # Build using the Dockerfile in current directory
    build:
      context: .
      dockerfile: Dockerfile

    # Tag the built image with a specific name
    image: citieye-server:latest

    # Container name for easier reference
    container_name: citieye-app

    # Port mapping: host_port:container_port
    # Access the app at http://localhost:8080
    ports:
      - "8080:8080"

    # Environment variables passed to the Spring Boot application
    # These override values in the packaged application.properties
    environment:
      # Database connection — variables sourced from .env file
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Hibernate/JPA configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

      # Flyway migration settings
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # Spring profiles
      SPRING_PROFILES_ACTIVE: dev

      # Logging levels
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_GOLDBYTE: DEBUG

      # JVM memory settings (passed to JAVA_OPTS in Dockerfile ENTRYPOINT)
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -XX:MinRAMPercentage=25.0
        -XX:+UseStringDeduplication

    # Wait for database to be healthy before starting
    depends_on:
      db:
        condition: service_healthy

    # Restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check using the Spring Boot Actuator health endpoint
    # curl is installed in the Dockerfile for this purpose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Networks
    networks:
      - backend

  # ========================================================================
  # PostgreSQL Database Service
  # ========================================================================
  db:
    # Official PostgreSQL image — Alpine variant for smaller footprint
    image: postgres:16-alpine

    # Container name
    container_name: citieye-db

    # Environment variables for PostgreSQL — sourced from .env file
    # These are kept in sync with SPRING_DATASOURCE_* via shared variables
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Port mapping — expose to host for local pgAdmin/psql access
    ports:
      - "5432:5432"

    # Volume for persistent data
    # Without this, database is lost when container stops
    volumes:
      # Named volume for database files
      - postgres_data:/var/lib/postgresql/data

      # Optional: Mount initialization SQL script
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    # Restart policy
    restart: unless-stopped

    # Health check for database readiness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Networks
    networks:
      - backend

  # ========================================================================
  # Optional: pgAdmin for Database Management
  # ========================================================================
  # Uncomment if you want a GUI to browse the database

  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: citieye-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - backend
  #   restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
# Named volumes persist data even when containers are stopped/removed

volumes:
  postgres_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
# Custom bridge network allows services to communicate by hostname

networks:
  backend:
    driver: bridge